<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路径浏览</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e3e3df; --accent:#2f6f9f;
  --path-solid:#3b4a5a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-columns:310px 1fr;grid-template-rows:1fr auto;height:100vh}
#side{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px}
#side h1{font-size:15px;margin:0 0 2px}
#side .sub{color:var(--muted);font-size:12px;margin-bottom:10px;word-break:break-all}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"▾";color:var(--muted);font-size:11px}
details:not([open]) summary::after{content:"▸"}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row label{flex:1;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=color]{width:24px;height:20px;border:1px solid var(--line);padding:0;background:none;border-radius:3px;cursor:pointer}
.row input[type=range]{width:70px}
.row .focus{border:1px solid var(--line);background:#fafafa;border-radius:4px;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--accent)}
.row .focus:hover{background:#eef4f9}
.sym{width:14px;height:14px;flex:none;display:inline-block}
.hint{color:var(--muted);font-size:11.5px;margin:4px 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:4px 0}
.seg button{flex:1;border:0;background:#fff;padding:3px 0;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
#stats{font-variant-numeric:tabular-nums}
#stats table{width:100%;border-collapse:collapse}
#stats td{padding:2px 0;border-bottom:1px dashed var(--line)}
#stats td:last-child{text-align:right}
#mapwrap{position:relative;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab;background:#fbfbfa}
svg#map.drag{cursor:grabbing}
#mapbtns{position:absolute;right:10px;top:10px;display:flex;gap:6px}
#mapbtns button{background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer;font-size:12px}
#scale{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted)}
#scale div{height:4px;border:1px solid #888;border-top:0;margin-bottom:2px}
#timebar{background:var(--panel);border-top:1px solid var(--line);padding:8px 16px 10px}
#timebar .top{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
#timebar button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;cursor:pointer}
#timebar select{border:1px solid var(--line);border-radius:4px;padding:2px}
#tlabel{font-variant-numeric:tabular-nums;font-weight:600}
#track{position:relative;height:42px}
#track canvas{position:absolute;left:0;top:0;width:100%;height:26px;border-radius:3px}
#track .win{position:absolute;top:0;height:26px;border:2px solid #111;border-radius:3px;background:rgba(255,255,255,.12);pointer-events:none}
#track input[type=range]{position:absolute;left:0;width:100%;top:26px;margin:0;pointer-events:none;-webkit-appearance:none;background:none;height:16px}
#track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:12px;height:14px;background:#111;border-radius:2px;cursor:ew-resize}
#track input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:14px;background:#111;border-radius:2px;border:0;cursor:ew-resize}
#tip{position:fixed;pointer-events:none;background:rgba(25,28,32,.94);color:#fff;font-size:12px;padding:6px 8px;border-radius:5px;max-width:300px;display:none;z-index:9;line-height:1.5}
#tip b{color:#ffd479}
.hit{cursor:pointer}
.param{display:grid;grid-template-columns:70px 1fr 54px;align-items:center;gap:6px;margin:5px 0}
.param input[type=range]{width:100%}
.param input[type=number]{width:54px;border:1px solid var(--line);border-radius:4px;padding:1px 3px}
.box{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:8px 0;background:#fcfbf8}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>路径浏览</h1>
    <div class="sub" id="meta"></div>

    <details open><summary>空间结构</summary>
      <div class="hint">勾选显示；色块改颜色，滑块改透明度。点「聚焦」放大到该范围。</div>
      <div id="geoRows"></div>
    </details>

    <details open><summary>行为数据</summary>
      <div id="behRows"></div>
      <div class="box">
        <div style="font-weight:600;margin-bottom:2px">逗留识别</div>
        <div class="hint">把相邻的停顿串起来：从第一次停顿到最后一次停顿，活动始终在半径 R 以内、持续不少于 T，记为一次逗留。中间的小移动算在内，走进来、走出去的路不算。</div>
        <div class="param"><span>时长 T (s)</span><input type="range" id="dwT" min="3" max="60" step="1"><input type="number" id="dwTn" min="3" max="60" step="1"></div>
        <div class="param"><span>半径 R (m)</span><input type="range" id="dwR" min="0.5" max="10" step="0.5"><input type="number" id="dwRn" min="0.5" max="10" step="0.5"></div>
        <div class="row"><span class="hint" id="dwInfo" style="flex:1;margin:0"></span><button class="focus" id="dwReset">恢复默认</button></div>
      </div>
      <div class="hint" style="margin-top:8px">点击筛选：</div>
      <div class="seg" id="tapFilter"><button data-v="all" class="on">全部</button><button data-v="blocked">只看受阻</button><button data-v="touched">只看摸到</button></div>
      <div class="hint">点击画在：</div>
      <div class="seg" id="tapPos"><button data-v="cam" class="on">被试位置</button><button data-v="hit">命中位置</button></div>
      <div class="hint">轨迹颜色：</div>
      <div class="seg" id="pathMode"><button data-v="time" class="on">按时间</button><button data-v="solid">单色</button></div>
    </details>

    <details open><summary>当前时间窗</summary>
      <div id="stats"></div>
    </details>

    <details><summary>说明</summary>
      <div class="hint" id="notes"></div>
    </details>
  </aside>

  <main id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="mapbtns"><button id="fitAll">全图</button></div>
    <div id="scale"><div id="scalebar"></div><span id="scaletext"></span></div>
  </main>

  <footer id="timebar">
    <div class="top">
      <button id="play">▶ 播放</button>
      <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="10" selected>10×</option><option value="30">30×</option><option value="60">60×</option></select>
      <label><input type="checkbox" id="lockWin"> 固定窗长播放</label>
      <span id="tlabel"></span>
      <button id="resetWin">全程</button>
    </div>
    <div id="track">
      <canvas id="tcanvas"></canvas>
      <div class="win" id="winbox"></div>
      <input type="range" id="t0" min="0" max="1000" value="0">
      <input type="range" id="t1" min="0" max="1000" value="1000">
    </div>
  </footer>
</div>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;

// ---------- 基础 ----------
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, parent) => { const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };
const fmt = s => { s=Math.max(0,s); const m=Math.floor(s/60), r=s-m*60; return m+":"+(r<10?"0":"")+r.toFixed(1); };
const store = {
  get(k,d){ try{ const v=localStorage.getItem("nbi_pv_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("nbi_pv_"+k,JSON.stringify(v)); }catch(e){} }
};
const VIR=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[110,206,88],[181,222,43],[253,231,37]];
function viridis(u){ u=Math.min(1,Math.max(0,u))*(VIR.length-1); const i=Math.floor(Math.min(u,VIR.length-2)), f=u-i, a=VIR[i], b=VIR[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`; }

const T_END = D.meta.duration;
let tWin=[0,T_END];
let tapPos="cam", pathMode="time", tapFilter="all";

// ---------- 地图坐标：x → 右，z → 上 ----------
const svg=$("#map");
const B=D.geo.bounds, PAD=3;
const full=[B.x_min-PAD, -(B.z_max+PAD), (B.x_max-B.x_min)+2*PAD, (B.z_max-B.z_min)+2*PAD];
let vb=full.slice();
const P = (x,z) => `${x},${-z}`;
const layers={};
["regions","bridges","aps","aplabels","walls","dwells","path","looks","stays","taplinks","taps","backsteps","events","glitches","now"].forEach(k=>layers[k]=el("g",{id:"L_"+k},svg));

// ---------- 空间结构 ----------
const REGION_PALETTE=["#5b8fd6","#e0995e","#6fb38a","#c07fbf","#d9c55a","#5fb7c4","#d47a7a","#8f8fd9"];
const geoStyle = store.get("geo_style",{});
function styleOf(key, color, alpha){ const s=geoStyle[key]||{}; return {color:s.color||color, alpha:(s.alpha!==undefined?s.alpha:alpha), on:(s.on!==undefined?s.on:true)}; }
function saveStyle(key,s){ geoStyle[key]=s; store.set("geo_style",geoStyle); }

const polys=D.geo.polygons;
const regions=polys.filter(p=>p.kind==="region"), bridges=polys.filter(p=>p.kind==="bridge"), aps=polys.filter(p=>p.kind==="attractive_point");
const geoEls={};   // id -> {shape,label}
function centroid(pts){ let x=0,z=0; pts.forEach(p=>{x+=p[0];z+=p[1];}); return [x/pts.length,z/pts.length]; }
function bbox(pts){ const xs=pts.map(p=>p[0]), zs=pts.map(p=>p[1]); return [Math.min(...xs),Math.min(...zs),Math.max(...xs),Math.max(...zs)]; }
function drawPoly(p, g, labelG, cls){
  const shape=el("polygon",{points:p.points.map(q=>P(q[0],q[1])).join(" "),class:"hit "+cls,"vector-effect":"non-scaling-stroke"},g);
  const c=centroid(p.points);
  const label=el("text",{x:c[0],y:-c[1],"text-anchor":"middle","dominant-baseline":"central","font-weight":"700","pointer-events":"none"},labelG);
  label.textContent=p.id;
  shape.addEventListener("mousemove",ev=>showTip(ev,polyTip(p)));
  shape.addEventListener("mouseleave",hideTip);
  shape.addEventListener("dblclick",ev=>{ev.stopPropagation(); focusBox(bbox(p.points));});
  geoEls[p.id]={shape,label,p};
}
regions.forEach(p=>drawPoly(p,layers.regions,layers.regions,"region"));
bridges.forEach(p=>drawPoly(p,layers.bridges,layers.bridges,"bridge"));
aps.forEach(p=>drawPoly(p,layers.aps,layers.aplabels,"ap"));
D.geo.air_walls.forEach(w=>{
  const pts=w.points.map(q=>P(q[0],q[1])).join(" ");
  el(w.closed?"polygon":"polyline",{points:pts,fill:"none","stroke-linecap":"round","stroke-linejoin":"round","vector-effect":"non-scaling-stroke",class:"wall"},layers.walls);
});

function applyGeo(){
  regions.forEach((p,i)=>{ const s=styleOf(p.id,REGION_PALETTE[i%REGION_PALETTE.length],0.28); const e=geoEls[p.id];
    e.shape.setAttribute("fill",s.color); e.shape.setAttribute("fill-opacity",s.alpha); e.shape.setAttribute("stroke",s.color); e.shape.setAttribute("stroke-width",1.2);
    e.label.setAttribute("fill",s.color); e.shape.style.display=e.label.style.display=s.on?"":"none"; });
  const sb=styleOf("__bridge","#b07b3e",0.45);
  bridges.forEach(p=>{ const e=geoEls[p.id]; e.shape.setAttribute("fill",sb.color); e.shape.setAttribute("fill-opacity",sb.alpha); e.shape.setAttribute("stroke",sb.color); e.shape.setAttribute("stroke-width",1.2); e.label.setAttribute("fill",sb.color); });
  layers.bridges.style.display=sb.on?"":"none";
  const sa=styleOf("__ap","#c2407f",0.12);
  aps.forEach(p=>{ const e=geoEls[p.id]; e.shape.setAttribute("fill",sa.color); e.shape.setAttribute("fill-opacity",sa.alpha); e.shape.setAttribute("stroke",sa.color); e.shape.setAttribute("stroke-width",1); e.shape.setAttribute("stroke-dasharray","4 2"); e.label.setAttribute("fill",sa.color); });
  layers.aps.style.display=sa.on?"":"none";
  const sl=styleOf("__aplabel","#c2407f",1); layers.aplabels.style.display=sl.on&&sa.on?"":"none"; layers.aplabels.setAttribute("opacity",sl.alpha);
  const sw=styleOf("__wall","#4b4b4b",0.9);
  layers.walls.querySelectorAll(".wall").forEach(w=>{ w.setAttribute("stroke",sw.color); w.setAttribute("stroke-opacity",sw.alpha); w.setAttribute("stroke-width",2); });
  layers.walls.style.display=sw.on?"":"none";
}

function geoRow(key, name, color, alpha, focusPts){
  const s=styleOf(key,color,alpha);
  const row=document.createElement("div"); row.className="row";
  row.innerHTML=`<label><input type="checkbox" ${s.on?"checked":""}><span class="name">${name}</span></label>
    <input type="color" value="${s.color}"><input type="range" min="0" max="1" step="0.05" value="${s.alpha}" title="透明度">${focusPts?'<button class="focus">聚焦</button>':""}`;
  const [cb,cp,rg]=row.querySelectorAll("input");
  const upd=()=>{ saveStyle(key,{on:cb.checked,color:cp.value,alpha:+rg.value}); applyGeo(); };
  cb.onchange=cp.oninput=rg.oninput=upd;
  if(focusPts) row.querySelector(".focus").onclick=()=>focusBox(focusPts());
  return row;
}
(function buildGeoRows(){
  const box=$("#geoRows");
  regions.forEach((p,i)=>box.appendChild(geoRow(p.id,`区域 ${p.id}　<span style="color:#999">${p.area_m2.toFixed(0)} m²</span>`,REGION_PALETTE[i%REGION_PALETTE.length],0.28,()=>bbox(p.points))));
  box.appendChild(geoRow("__bridge",`桥（${bridges.map(b=>b.id).join("、")}）`,"#b07b3e",0.45,()=>bbox(bridges.flatMap(b=>b.points))));
  box.appendChild(geoRow("__ap",`景点（${aps.length} 个）`,"#c2407f",0.12,null));
  box.appendChild(geoRow("__aplabel","景点编号","#c2407f",1,null));
  box.appendChild(geoRow("__wall","空气墙","#4b4b4b",0.9,null));
  const sel=document.createElement("div"); sel.className="row";
  sel.innerHTML=`<label><span class="name">聚焦景点</span></label><select id="apSel"><option value="">选择…</option>${aps.map(a=>`<option>${a.id}</option>`).join("")}</select>`;
  box.appendChild(sel);
  sel.querySelector("select").onchange=e=>{ const a=aps.find(x=>x.id===e.target.value); if(a) focusBox(bbox(a.points),6); };
})();

// ---------- 行为数据 ----------
const path=D.path; const N=path.t.length;
const CHUNK=5;
const chunks=[];
for(let i=0;i<N-1;i+=CHUNK){
  const j=Math.min(N-1,i+CHUNK); const pts=[];
  for(let k=i;k<=j;k++){ if(k>i && path.t[k]-path.t[k-1]>1.0){ break; } pts.push(P(path.x[k],path.z[k])); }
  if(pts.length<2) continue;
  const e=el("polyline",{points:pts.join(" "),fill:"none","stroke-width":2.2,"stroke-linecap":"round","stroke-linejoin":"round","vector-effect":"non-scaling-stroke"},layers.path);
  chunks.push({e,t0:path.t[i],t1:path.t[j],tm:(path.t[i]+path.t[j])/2});
}
function colorPath(){ chunks.forEach(c=>c.e.setAttribute("stroke", pathMode==="time"?viridis(c.tm/T_END):getComputedStyle(document.documentElement).getPropertyValue("--path-solid"))); }

function posAt(t){ // 插值得到 t 时刻的位置与朝向
  let lo=0,hi=N-1; if(t<=path.t[0]) return [path.x[0],path.z[0],path.yaw[0]]; if(t>=path.t[hi]) return [path.x[hi],path.z[hi],path.yaw[hi]];
  while(hi-lo>1){ const m=(lo+hi)>>1; if(path.t[m]<=t) lo=m; else hi=m; }
  const f=(t-path.t[lo])/(path.t[hi]-path.t[lo]); return [path.x[lo]+(path.x[hi]-path.x[lo])*f, path.z[lo]+(path.z[hi]-path.z[lo])*f, path.yaw[lo]];
}

const marks=[];   // {e, t0, t1, kind, rpx}
function mark(e,t0,t1,kind,rpx){ const m={e,t0,t1,kind,rpx}; marks.push(m); return m; }

// 停留
D.stays.forEach(s=>{
  const r=Math.min(16,Math.max(4,3+Math.sqrt(s.dur)*2.2));
  const c=el("circle",{cx:s.x,cy:-s.z,fill:"#7b4fa3","fill-opacity":0.28,stroke:"#7b4fa3","stroke-width":1.2,"vector-effect":"non-scaling-stroke",class:"hit"},layers.stays);
  c.addEventListener("mousemove",ev=>showTip(ev,`<b>停留</b> ${fmt(s.t0)} – ${fmt(s.t1)}<br>时长 ${s.dur.toFixed(1)} s<br>期间点击 ${s.taps} 次，摸到 ${s.touched} 次`));
  c.addEventListener("mouseleave",hideTip);
  mark(c,s.t0,s.t1,"stays",r);
});
// 点击
const INTENT_COLOR={WalkTo:"#4a6fa5",LookAt:"#2e9a6b",NoHit:"#9aa0a6"};
const INTENT_TEXT={WalkTo:"走过去",LookAt:"走近去看",NoHit:"没打中"};
const BLOCK_TEXT={NotBlocked:"未受阻",CutShort:"半路被截",NoStart:"起步受阻"};
const REASON_TEXT={NotBlocked:"",BarrierDenseSlope:"空气墙·密林坡地",BarrierWater:"空气墙·水域",BarrierUnlabeled:"空气墙·未标注",StepUp:"迈不上去",DropTooHigh:"落差太大",TooSteep:"太陡",NoGround:"无地面"};
const tapEls=[];
D.taps.forEach(tp=>{
  const g=el("g",{class:"hit"},layers.taps);
  const dot=el("circle",{fill:tp.intent==="NoHit"?"#fff":INTENT_COLOR[tp.intent]||"#777",stroke:INTENT_COLOR[tp.intent]||"#777","stroke-width":1.4,"vector-effect":"non-scaling-stroke"},g);
  let ring=null, cross=null;
  if(tp.touched) ring=el("circle",{fill:"none",stroke:"#e0a800","stroke-width":2.4,"vector-effect":"non-scaling-stroke"},g);
  if(tp.block==="CutShort") cross=el("circle",{fill:"none",stroke:"#e07b00","stroke-width":2,"stroke-dasharray":"2 1.5","vector-effect":"non-scaling-stroke"},g);
  if(tp.block==="NoStart") cross=el("path",{stroke:"#d03030","stroke-width":2.2,fill:"none","vector-effect":"non-scaling-stroke"},g);
  const link=(tp.hx!==null)?el("line",{x1:tp.x,y1:-tp.z,x2:tp.hx,y2:-tp.hz,stroke:INTENT_COLOR[tp.intent]||"#777","stroke-width":1,"stroke-dasharray":"3 2","vector-effect":"non-scaling-stroke","stroke-opacity":0.7},layers.taplinks):null;
  g.addEventListener("mousemove",ev=>showTip(ev,tapsTip(ev)));
  g.addEventListener("mouseleave",hideTip);
  tapEls.push({tp,g,dot,ring,cross,link});
  mark(g,tp.t,tp.t,"taps",0).tp=tp;
  if(link) mark(link,tp.t,tp.t,"taplinks",0).tp=tp;
});
// 同一位置常有多次点击叠在一起（如原地连点）：提示列出鼠标附近 8 像素内所有正在显示的点击
function tapText(tp){
  const d=tp.hx!==null?Math.hypot(tp.hx-tp.x,tp.hz-tp.z):null;
  return `<b>点击 #${tp.id}</b> ${fmt(tp.t)}　${INTENT_TEXT[tp.intent]||tp.intent} · ${tp.layer}${d!==null?` · 目标 ${d.toFixed(1)} m 外`:""}<br>`+
         `　${tp.touched?"<b>摸到</b> · ":""}${BLOCK_TEXT[tp.block]||tp.block}${REASON_TEXT[tp.reason]?" · "+REASON_TEXT[tp.reason]:""}`;
}
function tapsTip(ev){
  const r=svg.getBoundingClientRect(), k=pxToWorld();
  const wx=vb[0]+(ev.clientX-r.left)*k, wz=-(vb[1]+(ev.clientY-r.top)*k), lim=8*k;
  const near=tapEls.filter(o=>o.g.style.display!=="none" && (()=>{ const useHit=tapPos==="hit"&&o.tp.hx!==null;
      const x=useHit?o.tp.hx:o.tp.x, z=useHit?o.tp.hz:o.tp.z; return Math.hypot(x-wx,z-wz)<=lim; })()).map(o=>o.tp).sort((a,b)=>a.t-b.t);
  const list=near.length?near:[];
  if(list.length<=1) return list.length?tapText(list[0]):"";
  return `<b>此处 ${list.length} 次点击</b><br>`+list.slice(0,12).map(tapText).join("<br>")+(list.length>12?`<br>…另有 ${list.length-12} 次`:"");
}
function placeTaps(){
  const k=pxToWorld();
  tapEls.forEach(o=>{
    const useHit = tapPos==="hit" && o.tp.hx!==null;
    const x=useHit?o.tp.hx:o.tp.x, z=useHit?o.tp.hz:o.tp.z;
    const r=3.2*k;
    o.dot.setAttribute("cx",x); o.dot.setAttribute("cy",-z); o.dot.setAttribute("r",r);

// 逗留：把相邻的停顿（不动片段，长短不限）串起来，只要从第一次停顿开始到最后一次停顿结束，
// 所有采样到它们平均位置的距离都不超过 R，就并为一段；持续不少于 T 记为一次逗留。
// 因此逗留总是从一次停顿开始、到一次停顿结束：走进来、走出去的路不算在内，中间的小移动算在内。
// 单步间隔超过 1 s（切后台等）的不算停顿。
let dwells=[], dwellMarks=[];
function computeDwells(T,R){
  const eps=D.params.dwell_still_step_m, segs=[]; let s0=null;
  for(let k=1;k<N;k++){
    const st=Math.hypot(path.x[k]-path.x[k-1],path.z[k]-path.z[k-1])<=eps && path.t[k]-path.t[k-1]<=1.0;
    if(st){ if(s0===null) s0=k-1; } else if(s0!==null){ segs.push([s0,k-1]); s0=null; }
  }
  if(s0!==null) segs.push([s0,N-1]);
  const extent=(a,e)=>{ let sx=0,sz=0; for(let k=a;k<=e;k++){ sx+=path.x[k]; sz+=path.z[k]; } const n=e-a+1, cx=sx/n, cz=sz/n; let r=0;
    for(let k=a;k<=e;k++) r=Math.max(r,Math.hypot(path.x[k]-cx,path.z[k]-cz)); return {cx,cz,r}; };
  const out=[]; let g=0;
  while(g<segs.length){
    let h=g; while(h+1<segs.length && extent(segs[g][0],segs[h+1][1]).r<=R) h++;
    const a=segs[g][0], e=segs[h][1];
    if(path.t[e]-path.t[a]>=T){ const x=extent(a,e); out.push({i:a,j:e,t0:path.t[a],t1:path.t[e],x:x.cx,z:x.cz,r:x.r,pauses:h-g+1}); }
    g=h+1;
  }
  out.forEach(d=>{
    const tp=D.taps.filter(x=>x.t>=d.t0&&x.t<=d.t1), lk=D.looks.filter(l=>l.type==="Drag"&&l.t0>=d.t0&&l.t0<=d.t1);
    let path_m=0; for(let k=d.i+1;k<=d.j;k++) path_m+=Math.hypot(path.x[k]-path.x[k-1],path.z[k]-path.z[k-1]);
    Object.assign(d,{dur:d.t1-d.t0,path_m,taps:tp.length,lookat:tp.filter(x=>x.intent==="LookAt").length,touched:tp.filter(x=>x.touched).length,
      blocked:tp.filter(x=>x.block!=="NotBlocked").length,stays:D.stays.filter(s=>s.t0>=d.t0-0.05&&s.t1<=d.t1+0.05).length,moves:d.pauses-1,yaw:lk.reduce((a,l)=>a+l.yaw_path,0)});
  });
  return out;
}
function drawDwells(){

    const c=el("circle",{cx:d.x,cy:-d.z,r:Math.max(0.6,d.r+0.3),fill:"#f0a030","fill-opacity":0.22,stroke:"#d07a10","stroke-width":1.6,"stroke-dasharray":"5 3","vector-effect":"non-scaling-stroke",class:"hit"},layers.dwells);
    c.addEventListener("mousemove",ev=>showTip(ev,`<b>逗留 ${n+1}</b> ${fmt(d.t0)} – ${fmt(d.t1)}<br>持续 ${d.dur.toFixed(1)} s · 活动半径 ${d.r.toFixed(2)} m · 路程 ${d.path_m.toFixed(1)} m<br>停顿 ${d.pauses} 次（其中停留 ${d.stays} 段），中间小移动 ${d.moves} 次<br>点击 ${d.taps}（走近去看 ${d.lookat}）· 摸到 ${d.touched} · 受阻 ${d.blocked}<br>拖拽环视累计 ${d.yaw.toFixed(0)}°`));
    c.addEventListener("mouseleave",hideTip);

function inside(pts,x,z){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const xi=pts[i][0],zi=pts[i][1],xj=pts[j][0],zj=pts[j][1];
  if(((zi>z)!==(zj>z)) && (x<(xj-xi)*(z-zi)/(zj-zi)+xi)) c=!c; } return c; }
function samplesIn(poly){ let s=0; for(let i=1;i<N;i++){ const t=path.t[i]; if(t<tWin[0]||t>tWin[1]) continue; const dt=Math.min(path.t[i]-path.t[i-1],1.0); if(inside(poly.points,path.x[i],path.z[i])) s+=dt; } return s; }
function polyTip(p){

}

function updateTimebar(){
  const W=cv.getBoundingClientRect().width; const box=$("#winbox");
  box.style.left=(tWin[0]/T_END*W)+"px"; box.style.width=Math.max(2,(tWin[1]-tWin[0])/T_END*W)+"px";
  $("#tlabel").textContent=`${fmt(tWin[0])} – ${fmt(tWin[1])}　（共 ${fmt(T_END)}）`;
  s0.value=Math.round(tWin[0]/T_END*1000); s1.value=Math.round(tWin[1]/T_END*1000);
}
s0.oninput=()=>{ tWin[0]=Math.min(+s0.value/1000*T_END, tWin[1]-0.5); refresh(); };
s1.oninput=()=>{ tWin[1]=Math.max(+s1.value/1000*T_END, tWin[0]+0.5); refresh(); };
$("#resetWin").onclick=()=>{ tWin=[0,T_END]; refresh(); };
let playing=false, last=0;
$("#play").onclick=()=>{ playing=!playing; $("#play").textContent=playing?"❚❚ 暂停":"▶ 播放";
  if(playing){ if(tWin[1]>=T_END-0.01){ const L=tWin[1]-tWin[0]; tWin=$("#lockWin").checked?[0,Math.min(L,T_END)]:[tWin[0],tWin[0]+0.5]; } last=performance.now(); requestAnimationFrame(step); } };
function step(now){ if(!playing) return; const dt=(now-last)/1000*(+$("#speed").value); last=now;
  const L=tWin[1]-tWin[0]; tWin[1]=Math.min(T_END,tWin[1]+dt); if($("#lockWin").checked) tWin[0]=Math.max(0,tWin[1]-L);
  refresh(); if(tWin[1]>=T_END){ playing=false; $("#play").textContent="▶ 播放"; return; } requestAnimationFrame(step); }
document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  if(seg.id==="tapPos"){ tapPos=b.dataset.v; placeTaps(); } else if(seg.id==="tapFilter"){ tapFilter=b.dataset.v; refresh(); } else { pathMode=b.dataset.v; colorPath(); } }));

// ---------- 启动 ----------
$("#meta").innerHTML=`${D.meta.dataset} ／ ${D.meta.record}<br>时长 ${fmt(T_END)} · 生成于 ${D.meta.generated}`;
$("#notes").innerHTML=D.meta.notes.map(n=>"· "+n).join("<br>");
applyGeo(); colorPath();
$("#dwT").oninput=e=>setDwell(e.target.value,$("#dwR").value); $("#dwTn").onchange=e=>setDwell(e.target.value,$("#dwR").value);
$("#dwR").oninput=e=>setDwell($("#dwT").value,e.target.value); $("#dwRn").onchange=e=>setDwell($("#dwT").value,e.target.value);
$("#dwReset").onclick=()=>setDwell(dwDefault.T,dwDefault.R);
requestAnimationFrame(()=>{ fitBox(B.x_min,B.z_min,B.x_max,B.z_max,PAD); setDwell(dwDefault.T,dwDefault.R); });
window.addEventListener("resize",()=>{ drawTimeline(); updateTimebar(); });
</script>
</body>
</html>
